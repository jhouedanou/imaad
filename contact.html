<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — IMAAD Financial Group</title>
  <meta name="description" content="Contactez IMAAD Financial Group pour vos demandes institutionnelles, partenariats stratégiques ou soumissions de projets. Réponse garantie sous 48h. Email : infos@imaadholding.com">
  <meta name="keywords" content="contact IMAAD, financement projet Afrique, demande institutionnelle, partenariat PPP, financement souverain, infos@imaadholding.com">
  <meta name="author" content="IMAAD Financial Group">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://jhouedanou.github.io/imaad/contact.html">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jhouedanou.github.io/imaad/contact.html">
  <meta property="og:title" content="Contact — IMAAD Financial Group">
  <meta property="og:description" content="Contactez IMAAD Financial Group pour vos demandes institutionnelles, partenariats stratégiques ou soumissions de projets. Réponse sous 48h.">
  <meta property="og:image" content="https://jhouedanou.github.io/imaad/og-image.jpg">
  <meta property="og:locale" content="fr_FR">
  <meta property="og:site_name" content="IMAAD Financial Group">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Contact — IMAAD Financial Group">
  <meta name="twitter:description" content="Contactez IMAAD Financial Group pour vos projets en financement souverain, PPP ou Corporate Finance. Réponse sous 48h.">
  <meta name="twitter:image" content="https://jhouedanou.github.io/imaad/og-image.jpg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="navbar-mount"></div>

  <section class="contact-zeplin">
    <div class="contact-zeplin-grid">
      <div class="contact-zeplin-left">
        <div class="section-label">Travaillons ensemble</div>
        <h1>Nous contacter</h1>
        <p class="lead">Pour toute demande institutionnelle, partenariat stratégique ou soumission de projet, notre équipe vous répondra dans les 48 heures.</p>

        <div class="contact-info-card">
          <div class="icon-box">
            <img src="assets/icon-email.svg" alt="">
          </div>
          <div>
            <div class="info-label">E-mail</div>
            <a href="mailto:infos@imaadholding.com" class="info-value">infos@imaadholding.com</a>
          </div>
        </div>
      </div>

      <form class="contact-form-zeplin">
        <h3>Envoyer une demande</h3>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="contact-name">Nom complet <span class="req">*</span></label>
            <input type="text" id="contact-name" class="form-control" placeholder="Rym Moulaye" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-email">Email <span class="req">*</span></label>
            <input type="email" id="contact-email" class="form-control" placeholder="Rym Moulaye@imaadfg.com" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="contact-org">Organisation</label>
            <input type="text" id="contact-org" class="form-control" placeholder="Votre organisation">
          </div>
          <div class="form-group">
            <label class="form-label" for="contact-objet">Objet de la demande</label>
            <select id="contact-objet" class="form-control">
              <option>Sélectionner</option>
              <option>Financement souverain</option>
              <option>Partenariat PPP</option>
              <option>Corporate &amp; Trade</option>
              <option>Autre</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-file">Joindre un document</label>
          <div class="file-upload">
            <span class="file-upload-icon">📎</span>
            <span class="file-upload-text">Glisser un fichier ou cliquer</span>
            <input type="file" id="contact-file" hidden>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="contact-msg">Message</label>
          <textarea id="contact-msg" class="form-control" rows="4" placeholder="Décrivez votre projet ou votre demande…"></textarea>
        </div>
        <button type="submit" class="btn btn-gold">Envoyer la demande</button>
      </form>
    </div>
  </section>

  <div id="footer-mount"></div>

  <script src="components.js"></script>
  <script>
    document.getElementById('navbar-mount').innerHTML = IMAAD_NAV('contact');
    document.getElementById('footer-mount').innerHTML = IMAAD_FOOTER();
  </script>
</body>
</html>
